<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1520">
    <title>Appointments | XO Clinic</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .page-heading h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: var(--navy);
            margin: 0 0 4px;
        }

        .page-heading p {
            color: var(--muted);
            font-size: 13.5px;
            margin: 0;
        }

        .primary-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.28);
            transition: all 0.2s ease;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(13, 148, 136, 0.38);
            color: white;
        }

        .filter-panel, .table-panel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 22px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .panel-heading {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--navy);
            margin: 0 0 18px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(130px, 1fr));
            gap: 14px;
        }

        .filter-grid input, .filter-grid select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #f8fafc;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
        }

        .filter-grid input:focus, .filter-grid select:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .filter-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px solid var(--border-light);
        }

        .clear-btn {
            border: 1px solid var(--border);
            background: #ffffff;
            color: #475569;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            transition: all 0.18s ease;
        }

        .clear-btn:hover {
            background: #f1f5f9;
            color: var(--navy);
            border-color: #cbd5e1;
        }

        .result-count {
            color: var(--muted);
            font-size: 12.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .result-count::before {
            content: '●';
            color: var(--primary);
            font-size: 9px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
        }

        .appointments-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 820px;
            background: #ffffff;
        }

        .appointments-table th {
            text-align: left;
            padding: 13px 16px;
            color: #64748b;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.8px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
        }

        .appointments-table td {
            padding: 15px 16px;
            border-bottom: 1px solid var(--border-light);
            color: #334155;
            font-size: 13px;
            vertical-align: middle;
        }

        .appointments-table tbody tr {
            transition: background-color 0.15s ease;
        }

        .appointments-table tbody tr:hover {
            background: #f8fafc;
        }

        .appointments-table tr:last-child td {
            border-bottom: none;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .view-btn {
            background: #f0fdfa;
            color: #0f766e;
            border: 1px solid #ccfbf1;
        }
        .view-btn:hover { background: #ccfbf1; }

        .edit-btn {
            background: #f8fafc;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .edit-btn:hover { background: #e2e8f0; color: #0f172a; }

        .delete-btn {
            background: #fff1f2;
            color: #e11d48;
            border: 1px solid #ffe4e6;
        }
        .delete-btn:hover { background: #ffe4e6; color: #be123c; }

        .time-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }

        @media (max-width: 1050px) {
            .filter-grid {
                grid-template-columns: repeat(3, minmax(130px, 1fr));
            }
        }

        @media (max-width: 700px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body data-page="appointments">
<div class="dashboard-layout">
    <div id="sidebarMount"></div>

    <main class="main-content">
        <div class="page-heading">
            <div>
                <h1>Appointments</h1>
                <p>Manage, filter and review all scheduled patient sessions.</p>
            </div>

            <a href="add-appointment.html" class="primary-btn">
                <span>＋</span> New Appointment
            </a>
        </div>

        <section class="filter-panel">
            <h3 class="panel-heading">Search and Filter</h3>

            <div class="filter-grid">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search ID or patient name..."
                >

                <select id="doctorFilter">
                    <option value="">All Doctors</option>
                    <option value="Dr. Meera Sharma">Dr. Meera Sharma</option>
                    <option value="Dr. Rahul Patil">Dr. Rahul Patil</option>
                    <option value="Dr. Ananya Rao">Dr. Ananya Rao</option>
                    <option value="Dr. Vikram Desai">Dr. Vikram Desai</option>
                </select>

                <input type="date" id="dateFilter">

                <select id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>

                <select id="sortFilter">
                    <option value="asc">Oldest First</option>
                    <option value="desc">Newest First</option>
                </select>
            </div>

            <div class="filter-actions">
                <span class="result-count" id="resultCount">
                    Loading appointments...
                </span>

                <button class="clear-btn" id="clearFilters" type="button">
                    Clear Filters
                </button>
            </div>
        </section>

        <section class="table-panel">
            <h3 class="panel-heading">Appointment Directory</h3>

            <div class="table-wrapper">
                <table class="appointments-table">
                    <thead>
                        <tr>
                            <th>APPOINTMENT ID</th>
                            <th>PATIENT</th>
                            <th>DOCTOR</th>
                            <th>DATE</th>
                            <th>TIME</th>
                            <th>STATUS</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>

                    <tbody id="appointmentsTable">
                        <tr>
                            <td colspan="7" class="loading-cell">Loading appointments...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    <footer class="page-footer"><span>© 2026 XO Clinic</span><span>Thoughtful care. Organized simply.</span></footer>
    </main>
</div>

<script src="js/sidebar.js"></script>
<script src="js/appointment.js"></script>
</body>
</html>
