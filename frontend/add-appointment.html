
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101926">

    <title>Add Appointment | XO Clinic</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .page-heading {
            margin-bottom: 28px;
        }

        .form-panel {
            max-width: 900px;
        }

        .form-section-title {
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-light);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            box-sizing: border-box;
        }

        #formMessage {
            margin-top: 16px;
            font-size: 13px;
        }
    </style>
</head>

<body data-page="new-appointment">

<div class="dashboard-layout">

    <!-- SHARED SIDEBAR -->
    <div id="sidebarMount"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="page-heading">
            <div>
                <p class="header-date">PATIENT REGISTRATION</p>

                <h1 id="formTitle">Add New Appointment</h1>

                <p>
                    Enter patient and appointment information below.
                </p>
            </div>
        </header>

        <!-- APPOINTMENT FORM -->
        <section class="form-panel">

            <h3 class="form-section-title">
                Appointment Information
            </h3>

            <form id="appointmentForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="appointmentId">
                            Appointment ID
                        </label>

                        <input
                            type="text"
                            id="appointmentId"
                            name="appointmentId"
                            placeholder="Example: APT016"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="patientName">
                            Patient Name
                        </label>

                        <input
                            type="text"
                            id="patientName"
                            name="patientName"
                            placeholder="Enter patient name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="doctorName">
                            Doctor
                        </label>

                        <select
                            id="doctorName"
                            name="doctorName"
                            required
                        >
                            <option value="">Select Doctor</option>
                            <option value="Dr. Meera Sharma">Dr. Meera Sharma</option>
                            <option value="Dr. Rajesh Patil">Dr. Rajesh Patil</option>
                            <option value="Dr. Ananya Rao">Dr. Ananya Rao</option>
                            <option value="Dr. Vikram Desai">Dr. Vikram Desai</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="appointmentDate">
                            Appointment Date
                        </label>

                        <input
                            type="date"
                            id="appointmentDate"
                            name="appointmentDate"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="appointmentTime">
                            Appointment Time
                        </label>

                        <input
                            type="time"
                            id="appointmentTime"
                            name="appointmentTime"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="status">
                            Appointment Status
                        </label>

                        <select
                            id="status"
                            name="status"
                            required
                        >
                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="reason">
                            Reason for Appointment
                        </label>

                        <textarea
                            id="reason"
                            name="reason"
                            placeholder="Describe the reason for the appointment..."
                            required
                        ></textarea>
                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        class="save-btn"
                        id="saveButton"
                    >
                        Save Appointment
                    </button>

                    <a
                        href="appointments.html"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

                <div
                    id="formMessage"
                    aria-live="polite"
                ></div>

            </form>

        </section>

        <!-- FOOTER -->
        <footer class="page-footer">
            <span>© 2026 XO Clinic</span>
            <span>Thoughtful care. Organized simply.</span>
        </footer>

    </main>

</div>

<!-- SHARED SIDEBAR -->
<script src="js/sidebar.js"></script>

<!-- FORM FUNCTIONALITY -->
<script src="js/form.js"></script>

</body>
</html>
